<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ibom PowerHub</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #071a0c;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .logo {
      width: 140px;
      height: auto;
      margin-bottom: 24px;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-top: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 0;
    }
    .sub {
      font-size: 12px;
      color: #10b981;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <img src="arise.png" alt="ARISE" class="logo">
  <h1 class="title">IBOM POWERHUB</h1>
  <p class="sub">Akwa Ibom State</p>
  <div class="spinner"></div>
</body>
</html>
